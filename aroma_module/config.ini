# SD:/wiiu/rtl8153/config.ini
[dhcp]
# Obtain a fresh lease after each title transition.
mode=always

[debug]
# Hardware/lifecycle messages are also appended to driver.log on SD.
# Socket trace: 0 = off, 1 = general, 2 = verbose.
shim_trace=0

[compat]
# ax = the RTL8153/lwIP path (upstream configuration spelling).
dns=ax
route=ax
nssl=bridge
ftp_handoff=off
wiiload_handoff=off
# Optional NNCS rewrite for Pretendo/Inkay installations.
pretendo_rewrite=off
